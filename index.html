<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Size Fit Scanner</title>
  <!-- Only same-origin resources; WebAssembly compilation is allowed for body detection -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header Nav -->
  <header>
    <nav class="nav-container">
      <span class="logo">Size Fit Scanner</span>
    </nav>
  </header>

  <!-- Main Content -->
  <main id="app">

    <!-- Settings: language and delete all -->
    <section id="settings-section">
      <h2 data-i18n="settings.title"></h2>
      <label for="language-select" data-i18n="settings.language"></label>
      <select id="language-select">
        <option value="en">English</option>
        <option value="id">Bahasa Indonesia</option>
      </select>
      <button type="button" id="btn-delete-all" data-i18n="settings.delete"></button>
      <p id="settings-status" role="status"></p>
    </section>

    <!-- Profile (PROF-01) -->
    <section id="profile-section">
      <p id="manual-route-status" role="alert" hidden></p>
      <h2 data-i18n="profile.title"></h2>
      <p data-i18n="profile.intro"></p>
      <form id="profile-form" novalidate>
        <label for="profile-name" data-i18n="profile.name.label"></label>
        <input id="profile-name" name="name" type="text" maxlength="40" autocomplete="off" aria-describedby="profile-error">
        <p id="profile-error" role="alert" hidden></p>
        <button type="submit" data-i18n="profile.name.submit"></button>
      </form>
      <p id="profile-current"></p>
    </section>

    <!-- Typed body measurements (MEAS-07, MEAS-08) -->
    <section id="body-section" hidden>
      <h2 data-i18n="body.title"></h2>
      <p data-i18n="body.intro"></p>
      <form id="body-form" novalidate>
        <p>
          <label for="body-chest" data-i18n="body.chest.label"></label>
          <input id="body-chest" name="chest" type="text" inputmode="decimal" autocomplete="off" aria-describedby="body-chest-help body-chest-error">
          <small id="body-chest-help" data-i18n="body.chest.help"></small>
          <span id="body-chest-error" role="alert" hidden></span>
        </p>
        <p>
          <label for="body-shoulder" data-i18n="body.shoulder.label"></label>
          <input id="body-shoulder" name="shoulder" type="text" inputmode="decimal" autocomplete="off" aria-describedby="body-shoulder-help body-shoulder-error">
          <small id="body-shoulder-help" data-i18n="body.shoulder.help"></small>
          <span id="body-shoulder-error" role="alert" hidden></span>
        </p>
        <p>
          <label for="body-torso" data-i18n="body.torso.label"></label>
          <input id="body-torso" name="torso" type="text" inputmode="decimal" autocomplete="off" aria-describedby="body-torso-help body-torso-error">
          <small id="body-torso-help" data-i18n="body.torso.help"></small>
          <span id="body-torso-error" role="alert" hidden></span>
        </p>
        <button type="submit" data-i18n="body.save"></button>
      </form>
      <p id="body-status" role="status"></p>
      <ul id="body-sources"></ul>
    </section>

    <!-- Catalog (CAT-01, CAT-02, CAT-03) -->
    <section id="catalog-section">
      <h2 data-i18n="catalog.title"></h2>
      <ul id="catalog-list"></ul>
      <div id="chart-area"></div>
      <p id="chart-note"></p>
    </section>

    <!-- Fit check (FIT-01 to FIT-06) -->
    <section id="fit-section" hidden>
      <h2 data-i18n="fit.title"></h2>
      <p id="fit-hint" data-i18n="fit.need-measurements" hidden></p>
      <div id="fit-controls">
        <p>
          <label for="fit-size" data-i18n="fit.size.label"></label>
          <select id="fit-size"></select>
        </p>
        <fieldset>
          <legend data-i18n="fit.pref.legend"></legend>
          <input type="radio" name="preference" id="pref-regular" value="regular">
          <label for="pref-regular" data-i18n="fit.pref.regular"></label>
          <input type="radio" name="preference" id="pref-loose" value="loose">
          <label for="pref-loose" data-i18n="fit.pref.loose"></label>
          <input type="radio" name="preference" id="pref-oversize" value="oversize">
          <label for="pref-oversize" data-i18n="fit.pref.oversize"></label>
        </fieldset>
        <button type="button" id="btn-check-fit" data-i18n="fit.check"></button>
      </div>
      <div id="fit-result" hidden>
        <p id="fit-verdict" role="status"></p>
        <p id="fit-recommended"></p>
        <ul id="fit-areas"></ul>
        <h3 data-i18n="compare.title"></h3>
        <table id="fit-compare"></table>
      </div>
    </section>

    <!-- History (PROF-03) -->
    <section id="history-section">
      <h2 data-i18n="history.title"></h2>
      <ul id="history-list"></ul>
      <p id="history-empty" data-i18n="history.empty"></p>
    </section>

    <!-- Existing height and camera scan flow -->
    <details id="scan-area">
    <summary data-i18n="scan.summary"></summary>

    <!-- Height entry (CAPT-01) -->
    <section id="height-section" class="height-panel">
      <h2 data-i18n="height.title"></h2>
      <p data-i18n="height.intro"></p>
      <form id="height-form" novalidate>
        <label class="form-label" for="height-input" data-i18n="height.label"></label>
        <input class="form-input" id="height-input" name="height" type="text" inputmode="decimal" autocomplete="off" aria-describedby="height-error" data-i18n-placeholder="height.placeholder">
        <p class="form-error" id="height-error" role="alert" hidden></p>
        <button class="btn btn-primary" id="btn-height-submit" type="submit" data-i18n="height.submit"></button>
      </form>
    </section>

    <!-- Camera consent (PRIV-01) -->
    <section id="consent-section" hidden>
      <h2 data-i18n="consent.title"></h2>
      <p data-i18n="consent.use"></p>
      <p data-i18n="consent.saved"></p>
      <p data-i18n="consent.sound"></p>
      <button type="button" id="btn-consent-accept" data-i18n="consent.accept"></button>
      <button type="button" id="btn-consent-decline" data-i18n="consent.decline"></button>
    </section>

    <!-- Camera -->
    <section id="camera-section" hidden>
      <div class="camera-panel">
        <div class="video-wrapper">
          <video id="webcam" playsinline muted autoplay></video>
          <canvas id="view-canvas"></canvas>
        </div>

        <!-- Detector loading -->
        <div class="camera-loading" id="camera-loading" hidden>
          <div class="spinner"></div>
          <h3 data-i18n="camera.loading.title"></h3>
          <p data-i18n="camera.loading.body"></p>
        </div>

        <!-- Camera error -->
        <div class="camera-fallback" id="camera-error" hidden>
          <h3 id="camera-error-title" data-i18n="camera.error.title"></h3>
          <p id="camera-error-message"></p>
          <div class="cover-actions">
            <button class="btn btn-primary" id="btn-camera-retry" data-i18n="camera.retry"></button>
            <button class="btn btn-secondary" id="btn-manual-entry" data-i18n="manual.go"></button>
          </div>
        </div>

        <!-- Camera controls -->
        <div class="camera-hud" id="camera-hud">
          <div class="hud-status" id="camera-status" role="status"></div>
          <div class="hud-controls">
            <button class="hud-btn" id="btn-camera-start" data-i18n="camera.start" hidden></button>
            <button class="hud-btn" id="btn-camera-stop" data-i18n="camera.stop"></button>
          </div>
        </div>
      </div>

      <!-- Pose guide hint (CAPT-02, CAPT-03) -->
      <section id="guide-area">
        <p id="guide-hint" role="status" aria-live="polite"></p>
        <button type="button" id="btn-guide-restart" data-i18n="guide.restart"></button>
      </section>

      <!-- Current height and privacy note -->
      <div class="camera-meta" id="camera-meta">
        <span id="height-current"></span>
        <button class="btn btn-secondary" id="btn-change-height" data-i18n="height.change"></button>
        <p class="privacy-note" data-i18n="camera.privacy-note"></p>
      </div>

      <!-- Manual front and side capture fallback (MEAS-01 to MEAS-05) -->
      <section id="scan-capture">
        <h3 data-i18n="scan.capture.title"></h3>
        <p data-i18n="scan.capture.intro"></p>
        <p data-i18n="scan.manual.note"></p>
        <button class="btn btn-primary" id="btn-capture-front" data-i18n="debug.capture.front"></button>
        <button class="btn btn-primary" id="btn-capture-side" data-i18n="debug.capture.side"></button>
        <button class="btn btn-secondary" id="btn-capture-reset" data-i18n="debug.capture.reset"></button>
        <p id="capture-status" role="status"></p>
        <p id="scan-front-status"></p>
        <p id="scan-side-status"></p>
      </section>
    </section>

    <!-- Review scanned measurements (MEAS-06) -->
    <section id="review-section" hidden>
      <h2 data-i18n="review.title"></h2>
      <p data-i18n="review.intro"></p>
      <form id="review-form" novalidate>
        <p id="review-name-row" hidden>
          <label for="review-name" data-i18n="review.name.label"></label>
          <input id="review-name" type="text" maxlength="40" autocomplete="off" aria-describedby="review-name-error">
          <span id="review-name-error" role="alert" hidden></span>
        </p>
        <p>
          <label for="review-shoulder" data-i18n="body.shoulder.label"></label>
          <input id="review-shoulder" name="shoulder" type="text" inputmode="decimal" autocomplete="off" aria-describedby="review-shoulder-marker review-shoulder-error">
          <span id="review-shoulder-marker"></span>
          <span id="review-shoulder-error" role="alert" hidden></span>
        </p>
        <p>
          <label for="review-chest" data-i18n="body.chest.label"></label>
          <input id="review-chest" name="chest" type="text" inputmode="decimal" autocomplete="off" aria-describedby="review-chest-marker review-chest-error">
          <span id="review-chest-marker"></span>
          <span id="review-chest-error" role="alert" hidden></span>
        </p>
        <p>
          <label for="review-waist" data-i18n="body.waist.label"></label>
          <input id="review-waist" name="waist" type="text" inputmode="decimal" autocomplete="off" aria-describedby="review-waist-marker review-waist-error">
          <span id="review-waist-marker"></span>
          <span id="review-waist-error" role="alert" hidden></span>
        </p>
        <p>
          <label for="review-torso" data-i18n="body.torso.label"></label>
          <input id="review-torso" name="torso" type="text" inputmode="decimal" autocomplete="off" aria-describedby="review-torso-marker review-torso-error">
          <span id="review-torso-marker"></span>
          <span id="review-torso-error" role="alert" hidden></span>
        </p>
        <p>
          <label for="review-arm" data-i18n="body.arm.label"></label>
          <input id="review-arm" name="arm" type="text" inputmode="decimal" autocomplete="off" aria-describedby="review-arm-marker review-arm-error">
          <span id="review-arm-marker"></span>
          <span id="review-arm-error" role="alert" hidden></span>
        </p>
        <button type="submit" data-i18n="review.save"></button>
      </form>
      <p id="review-status" role="status"></p>
    </section>

    <!-- Debug view -->
    <section id="debug-section" class="debug-panel" hidden>
      <h2 data-i18n="debug.title"></h2>
      <p class="debug-note" data-i18n="debug.clothing-note"></p>
      <div class="debug-controls">
        <button class="hud-btn" id="btn-toggle-skeleton" data-i18n="debug.toggle.skeleton"></button>
        <button class="hud-btn" id="btn-toggle-mask" data-i18n="debug.toggle.mask"></button>
        <button class="hud-btn" id="btn-toggle-mirror" data-i18n="debug.toggle.mirror"></button>
      </div>
      <h3 data-i18n="debug.live.title"></h3>
      <dl class="debug-readings" id="debug-live"></dl>
      <h3 data-i18n="debug.captured.title"></h3>
      <dl class="debug-readings" id="debug-captured"></dl>
      <dl class="debug-readings" id="debug-engine"></dl>
    </section>

    </details>

  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
